# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: ℝ²
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: rupadarshiray.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Latin Modern Sansww
      body: Latin Modern Sans
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    options:
      maxDepth: 6
      minEntries: 1
      showByDefault: true
      collapseByDefault: false
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: mathjax
      customMacros:
        N: '\mathbb{N}'
        Q: '\mathbb{Q}'
        Z: '\mathbb{Z}'
        R: '\mathbb{R}'
        C: '\mathbb{C}'
        H: '\mathbb{H}'
        O: '\mathbb{O}'
        F: '\mathbb{F}'
        g: '\text{g}'

        cosec: ['\mathrm{cosec} #1', 1]

        # Derivatives
        dd: '\mathrm{d}'
        ddn: ['\mathrm{d}^{#1} #2', 2]
        dv: ['\frac{\mathrm{d}}{\mathrm{d} #1}', 1]
        dvf: ['\frac{\mathrm{d} #1}{\mathrm{d} #2}', 2]
        dvfn: ['\frac{\mathrm{d}^{#1} #2}{\mathrm{d} #3^{#1}}', 3]
        pdvf: ['\frac{\partial #1}{\partial #2}', 2]
        dpartial: '\overset{\int}{\partial}'
        dpvf: ['\frac{\dpartial #1}{\partial #2}', 2]
        DD: '\mathfrak{D}'
        xsim: ['\overset{#1}{\sim}', 1]

        # Algebra
        ip: ['\left\langle #1 \right\rangle', 1]
        norm: ['\left\Vert #1 \right\Vert', 1]
        orb: ['\mathrm{orb}_#1 (#2)', 2]
        stab: ['\mathrm{stab}_#1 (#2)', 2]
        coker: '\mathrm{coker}'

        # Categories and fonts
        mor: ['\mathrm{#1}', 1]
        cat: ['\mathsf{#1}', 1]
        nrm: ['\text{#1 }', 1]
        nit: ['\mathit{#1}', 1]
        nsf: ['\mathsf{#1}', 1]
        nbit: ['\boldsymbol{\mathit{#1}}', 1]
        goth: ['\mathfrak{#1}', 1]
        sct: ['\boldsymbol{\mathsf{\Gamma #1}}', 1, ' ']
        mdu: ['\mathop{Mod}_{#1}^{#2}', 2]
        isom: '\cong'
        im: '\mathrm{im}\ '
        T: 'T'
        lm: ['\boxed{\mathtt{#1}}', 1]

        # Diagram arrows
        ra: ['\kern-1.5ex\xrightarrow{\ \ #1\ \ }\phantom{}\kern-1.5ex', 1]
        ras: ['\kern-1.5ex\xrightarrow{\ \ \smash{#1}\ \ }\phantom{}\kern-1.5ex', 1]
        da: ['\bigg\downarrow\raise.5ex\hbox{\rlap{\scriptstyle #1}}', 1]
        ua: ['\bigg\uparrow\raise.5ex\hbox{\rlap{\scriptstyle #1}}', 1]

        mapsfrom: '\leftarrow\!\shortmid'
        longmapsfrom: '\longleftarrow\!\shortmid'
        Sha: '\text{Ш}'

        lq: ['{_{\Large #2}}\big\backslash{^{\Large #1}}', 2]
        rq: ['{^{\Large #1}}\big/{_{\Large #2}}', 2]
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: true
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
    options:
      maxTabs: 8
      mobileBreakpoint: 800
      showSpines: true
      animateTransitions: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: true
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: rupadarshiray/rupadarshiray.github.io
        repoId: R_kgDOTAl_1A
        category: Announcements
        categoryId: DIC_kwDOTAl_1M4C_lh6
        lang: en
        # Other options...
        themeUrl: "https://rupadarshiray.github.io/static/giscus" # corresponds to quartz/static/giscus/
        lightTheme: light # corresponds to light-theme.css in quartz/static/giscus/
        darkTheme: dark # corresponds to dark-theme.css in quartz/static/giscus/
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
  - source: github:quartz-community/recent-notes
    enabled: true
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        # - aliases
        - wikipedia
        - site
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source:
      name: quartz-themes
      repo: github:saberzero1/quartz-themes
      subdir: plugin
    enabled: false
    options:
      theme: sanctum
  - source: github:quartz-community/obsidian-plugin-excalidraw
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
